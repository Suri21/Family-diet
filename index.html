<style>
  :root {
    --ground: #EAF2EE; --surface: #FFFFFF; --ink: #141A18; --muted: #59645F; --soft: #8A938F;
    --line: #E3E6E0; --line-2: #EEF0EC;
    --accent: #0E6B5C; --accent-ink: #0B5A4D; --accent-soft: #E1EFEA;
    --warn-bg: #FCEFE5; --warn-ink: #7A3606;
    --veg: #34420E; --veg-bg: #E6EDD2; --veg-dot: #6E8A1F;
    --tag-bg: #F0EEF8; --tag-ink: #4A3B8C;
    --shadow: 0 1px 2px rgba(20, 26, 24, .04), 0 2px 8px rgba(20, 26, 24, .04);
    --pad: 16px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  html, body { margin: 0; background: var(--ground); color: var(--ink); }
  body { font-family: 'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  button { font: inherit; color: inherit; touch-action: manipulation; }
  h1, h2, p { margin: 0; }
  .app { max-width: 480px; margin: 0 auto; min-height: 100vh; min-height: 100dvh; padding-bottom: calc(env(safe-area-inset-bottom) + 8px); }
  @media (min-width: 520px) {
    body { background: #DDE8E3; }
    .app { background: var(--ground); box-shadow: 0 0 0 1px var(--line), 0 10px 40px rgba(20, 26, 24, .06); }
  }
  :focus-visible { outline: 3px solid #7FC0B3; outline-offset: 2px; }

  /* chips */
  .chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; line-height: 1; border-radius: 999px; padding: 5px 9px; white-space: nowrap; }
  .chip svg { flex-shrink: 0; }
  .chip.goal { background: var(--accent-soft); color: var(--accent-ink); }
  .chip.veg { background: var(--veg-bg); color: var(--veg); }
  .chip.plain { background: #ECEEEA; color: #3B4541; }

  /* home */
  .hero { padding: calc(env(safe-area-inset-top) + 28px) 20px 6px; }
  .date { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; font-weight: 700; color: var(--muted); }
  h1 { margin-top: 8px; font-size: 30px; line-height: 1.1; font-weight: 800; letter-spacing: -.025em; }
  .lede { margin-top: 8px; font-size: 14px; line-height: 1.5; color: var(--muted); max-width: 36ch; }
  .section { padding: 18px var(--pad) 0; }
  .section-h { display: flex; align-items: center; gap: 8px; margin: 0 4px 10px; font-size: 12px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
  .cards { display: flex; flex-direction: column; gap: 10px; }
  .card { display: block; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 20px;
    padding: 14px 14px 13px; cursor: pointer; box-shadow: var(--shadow); transition: transform .12s ease, border-color .12s ease; }
  .card:hover { border-color: #CDD2CB; }
  .card:active { transform: scale(.985); }
  .card-top { display: flex; align-items: center; gap: 12px; }
  .avatar { width: 44px; height: 44px; flex-shrink: 0; border-radius: 50%; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 800; }
  .avatar.lg { width: 60px; height: 60px; font-size: 23px; }
  .who { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 5px; }
  .who-name { display: flex; align-items: baseline; gap: 6px; font-size: 16px; font-weight: 800; }
  .who-age { font-size: 12px; font-weight: 600; color: var(--muted); }
  .chev { color: var(--soft); display: flex; }
  .minimeals { margin-top: 12px; padding-top: 11px; border-top: 1px solid var(--line-2); display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: 12px; row-gap: 7px; align-items: baseline; }
  .mm-k { font-size: 10.5px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--soft); }
  .mm-v { font-size: 13.5px; font-weight: 500; line-height: 1.35; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .foot { padding: 22px 24px 18px; font-size: 12px; color: var(--muted); text-align: center; line-height: 1.5; }

  /* member */
  .topbar { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 2px; padding: calc(env(safe-area-inset-top) + 6px) 8px 6px;
    background: rgba(234, 242, 238, .88); -webkit-backdrop-filter: saturate(1.5) blur(14px); backdrop-filter: saturate(1.5) blur(14px); }
  .topbar.scrolled { box-shadow: 0 1px 0 var(--line); }
  .topbar-title { flex: 1; min-width: 0; font-size: 16px; font-weight: 800; opacity: 0; transition: opacity .15s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .topbar.scrolled .topbar-title { opacity: 1; }
  .icon-btn { width: 44px; height: 44px; flex-shrink: 0; border: none; background: transparent; border-radius: 12px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
  .icon-btn:hover { background: rgba(20, 26, 24, .05); }
  .icon-btn:active { background: rgba(20, 26, 24, .08); }
  .profile { padding: 2px 20px 16px; display: flex; align-items: center; gap: 14px; }
  .pname { font-size: 26px; font-weight: 800; letter-spacing: -.02em; line-height: 1.15; }
  .pchips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; }
  .info { margin: 0 var(--pad) 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; box-shadow: var(--shadow); }
  .info-row { display: flex; gap: 10px; padding: 12px 14px; font-size: 13.5px; line-height: 1.5; }

const state = { screen: 'home', memberId: null, offset: 0, view: 'day' };

/* ---------- home ---------- */
function homeView(today) {
  const di = dayIndex(today);
  const card = (m) => `
    <button type="button" class="card" data-open="${esc(m.id)}">
      <span class="card-top">
        <span class="avatar" style="background:${esc(m.color)}">${esc(m.name.charAt(0))}</span>
        <span class="who">
          <span class="who-name">${esc(m.name)}<span class="who-age">${esc(m.age)} yrs</span></span>
          <span class="chip goal">${esc(m.goal)}</span>
        </span>
        <span class="chev">${svg('next', 20, 2)}</span>
      </span>
      <span class="minimeals">
        <span class="mm-k">Breakfast</span><span class="mm-v">${esc(mealFor(m, 'breakfast', di))}</span>
        <span class="mm-k">Lunch</span><span class="mm-v">${esc(mealFor(m, 'lunch', di))}</span>
        <span class="mm-k">Dinner</span><span class="mm-v">${esc(mealFor(m, 'dinner', di))}</span>
      </span>
    </button>`;
  const sections = HOMES.map((h) => `
    <section class="section" aria-label="${esc(h.name)}">
      <h2 class="section-h">${svg('home', 16, 2)}${esc(h.name)}</h2>
      <div class="cards">${FAMILY.filter((m) => m.home === h.id).map(card).join('')}</div>
    </section>`).join('');
  return `
    <header class="hero">
      <div class="date"><span>${esc(fmtDate(today))}</span>${isVeg(di) ? vegChip : ''}</div>
      <h1>Family diet</h1>
      <p class="lede">More protein, fibre, fruit and vegetables. Smaller portions of rice, roti and maida.</p>
    </header>
    <main>${sections}</main>
    <p class="foot">The plan repeats every week · Tuesdays and Saturdays are veg days</p>`;
}

/* ---------- member ---------- */
function memberView(m, today) {
  const head = `
    <div class="topbar" id="topbar">
      <button type="button" class="icon-btn" data-home aria-label="Back to family">${svg('back', 22, 2.2)}</button>
      <span class="topbar-title">${esc(m.name)}</span>
    </div>
    <div class="profile">
      <span class="avatar lg" style="background:${esc(m.color)}">${esc(m.name.charAt(0))}</span>
      <div style="min-width:0">
        <h1 class="pname">${esc(m.name)}</h1>
        <div class="pchips">
          <span class="chip goal">${esc(m.goal)}</span>
          <span class="chip plain">${esc(m.age)} yrs</span>
          <span class="chip plain">${esc(m.food)}</span>
        </div>
      </div>
    </div>
    <div class="info">
      <div class="info-row warn">${svg('avoid', 17, 2)}<span><strong>Avoid:</strong> ${esc(m.avoid)}</span></div>
      ${m.note ? `<div class="info-row tip">${svg('tip', 17, 2)}<span>${esc(m.note)}</span></div>` : ''}
    </div>
    <div class="seg" role="group" aria-label="View">
      <button type="button" data-view="day" aria-pressed="${state.view === 'day'}">Day</button>
      <button type="button" data-view="week" aria-pressed="${state.view === 'week'}">Week plan</button>
    </div>`;
  return head + (state.view === 'week' ? weekView(m, today) : dayView(m, today));
}

function dayView(m, today) {
  const date = addDays(today, state.offset);
  const di = dayIndex(date);
  const monday = addDays(date, -di);
  const sunday = addDays(monday, 6);
  const days = DAY_SHORT.map((n, i) => {
    const d = addDays(monday, i);
    const off = diffDays(d, today);
    const cls = 'day' + (i === di ? ' is-sel' : '') + (off === 0 ? ' is-today' : '');
    return `<button type="button" class="${cls}" data-offset="${off}" aria-pressed="${i === di}" aria-label="${DAY_LONG[i]} ${d.getDate()}${off === 0 ? ', today' : ''}${isVeg(i) ? ', veg day' : ''}">
      <span class="dn">${n}</span><span class="dd">${d.getDate()}</span>${isVeg(i) ? '<span class="vdot"></span>' : ''}</button>`;
  }).join('');

  const items = SLOTS.map((s) => {
    const portion = m.portions && m.portions[s.key] && m.portions[s.key] !== 'As listed' ? m.portions[s.key] : '';
    return `
      <div class="t-item">
        <div class="t-icon">${svg(s.icon, 20, 1.9)}</div>
        <div class="t-card">
          <div class="t-head"><span class="t-label">${esc(s.label)}</span><span class="t-time">${esc(MEAL_TIMES[s.key])}</span></div>
          <div class="t-items">${esc(mealFor(m, s.key, di))}</div>
          ${portion ? `<div class="portion">${svg('scale', 15, 2)}<span><b>Your portion:</b> ${esc(portion)}</span></div>` : ''}
          <div class="tags">${s.tags.map((t) => `<span class="tag">${esc(t)}</span>`).join('')}</div>
        </div>
      </div>`;
  }).join('');

  return `
    <div class="weekbar">
      <div class="weekbar-h">
        <button type="button" class="icon-btn" data-shift="-7" aria-label="Previous week">${svg('back', 20, 2.2)}</button>
        <span class="weekbar-label">${esc(fmtShort(monday))} – ${esc(fmtShort(sunday))}</span>
        <button type="button" class="icon-btn" data-shift="7" aria-label="Next week">${svg('next', 20, 2.2)}</button>
      </div>
      <div class="days">${days}</div>
      <div class="legend"><i></i>Veg day · no non-veg or eggs</div>
    </div>
    <div class="daytitle">
      <div><h2 aria-live="polite">${esc(relLabel(date))}</h2><div class="sub">${esc(fmtDate(date))}</div></div>
      <div class="right">${isVeg(di) ? vegChip : ''}${state.offset !== 0 ? '<button type="button" class="link-btn" data-today>Today</button>' : ''}</div>
    </div>
    <main class="timeline" data-swipe>${items}</main>
    <p class="swipe-hint">Swipe left or right to change the day</p>`;
}

function weekView(m, today) {
  const todayIdx = dayIndex(today);
  const p = m.portions || {};
  const every = `
    <div class="wcard static">
      <div class="whead"><span class="wtitle">Every day</span></div>
      <div class="wrows">
        <span class="wk">${esc(MEAL_TIMES.early)}</span><span class="wv">${esc(m.early)}</span>
        <span class="wk">${esc(MEAL_TIMES.evening)}</span><span class="wv">${esc(m.evening)}</span>
        ${p.lunch ? `<span class="wk">Lunch qty</span><span class="wv">${esc(p.lunch)}</span>` : ''}
        ${p.dinner ? `<span class="wk">Dinner qty</span><span class="wv">${esc(p.dinner)}</span>` : ''}
      </div>
    </div>`;
  const days = DAY_LONG.map((name, i) => `
    <button type="button" class="wcard${i === todayIdx ? ' is-today' : ''}" data-goto="${i}">
      <span class="whead"><span class="wtitle">${name}</span>
        <span class="wchips">${isVeg(i) ? vegChip : ''}${i === todayIdx ? '<span class="chip today">Today</span>' : ''}</span></span>
      <span class="wrows">
        <span class="wk">Breakfast</span><span class="wv">${esc(mealFor(m, 'breakfast', i))}</span>
        <span class="wk">Fruit</span><span class="wv">${esc(mealFor(m, 'midMorning', i))}</span>
        <span class="wk">Lunch</span><span class="wv">${esc(mealFor(m, 'lunch', i))}</span>
        <span class="wk">Dinner</span><span class="wv">${esc(mealFor(m, 'dinner', i))}</span>
      </span>
    </button>`).join('');
  return `<main class="wlist">${every}${days}</main>`;
}

/* ---------- rendering & events ---------- */
function render(resetScroll) {
  const app = document.getElementById('app');
  const today = startOfToday();
  let html;
  if (state.screen === 'member') {
    const m = FAMILY.find((f) => f.id === state.memberId);
    if (m) html = memberView(m, today);
    else state.screen = 'home';
  }
  if (!html) html = homeView(today);
  app.innerHTML = html;
  if (resetScroll) window.scrollTo(0, 0);
  onScroll();
}

function onScroll() {
  const bar = document.getElementById('topbar');
  if (bar) bar.classList.toggle('scrolled', window.scrollY > 60);
}

function openMember(id) {
  state.screen = 'member'; state.memberId = id; state.offset = 0; state.view = 'day';
  history.pushState({ m: id }, '', '#' + id);
  render(true);
}
function goHome() {
  if (history.state && history.state.m) { history.back(); return; }
  state.screen = 'home'; state.memberId = null;
  history.replaceState(null, '', location.pathname + location.search);
  render(true);
}

document.getElementById('app').addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  const d = b.dataset;
  if (d.open) openMember(d.open);
  else if ('home' in d) goHome();
  else if (d.shift) { state.offset += Number(d.shift); render(); }
  else if (d.offset !== undefined) { state.offset = Number(d.offset); render(); }
  else if ('today' in d) { state.offset = 0; render(); }
  else if (d.view) { state.view = d.view; render(); }
  else if (d.goto !== undefined) { state.offset = Number(d.goto) - dayIndex(startOfToday()); state.view = 'day'; render(true); }
});

// Swipe between days on the day view
let touch = null;
document.addEventListener('touchstart', (e) => {
  if (!e.target.closest('[data-swipe]') || e.touches.length !== 1) { touch = null; return; }
  touch = { x: e.touches[0].clientX, y: e.touches[0].clientY };
}, { passive: true });
document.addEventListener('touchend', (e) => {
  if (!touch) return;
  const dx = e.changedTouches[0].clientX - touch.x, dy = e.changedTouches[0].clientY - touch.y;
  touch = null;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) { state.offset += dx < 0 ? 1 : -1; render(); }
}, { passive: true });

window.addEventListener('scroll', onScroll, { passive: true });

function fromHash() {
  const id = decodeURIComponent(location.hash.slice(1));
  if (id && FAMILY.some((f) => f.id === id)) { state.screen = 'member'; state.memberId = id; }
  else { state.screen = 'home'; state.memberId = null; }
  state.offset = 0; state.view = 'day';
  render(true);
}
window.addEventListener('popstate', fromHash);

// If the app stays open past midnight, refresh the date when it comes back into view.
let lastDay = startOfToday().getTime();
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && startOfToday().getTime() !== lastDay) { lastDay = startOfToday().getTime(); render(); }
});
fromHash();
</script>
</body>
</html>
